stages:
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"

.python_cache:
  cache:
    key: ${CI_COMMIT_REF_SLUG}-python
    paths:
      - .venv/
      - .cache/pip
    policy: pull-push

.node_cache:
  cache:
    key: ${CI_COMMIT_REF_SLUG}-node
    paths:
      - frontend/node_modules/
      - frontend/.npm/
    policy: pull-push

test:backend:
  stage: test
  image: python:3.11-slim
  extends: .python_cache
  before_script:
    - pip install poetry
    - poetry config virtualenvs.create true
    - poetry config virtualenvs.in-project true
    - poetry install --no-root
  script:
    - poetry run pytest tests/ --cov=app --cov-report=term --cov-report=xml
    - poetry run black app/ tests/ --check
    - poetry run flake8 app/ tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  only:
    - merge_requests
    - main
    - develop

test:frontend:
  stage: test
  image: node:18-alpine
  extends: .node_cache
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint
    - npm run test:ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 day
  only:
    - merge_requests
    - main
    - develop

build:docker:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA -f Dockerfile .
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA -f frontend/Dockerfile.prod frontend/
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        docker tag $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/backend:latest
        docker tag $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/frontend:latest
        docker push $CI_REGISTRY_IMAGE/backend:latest
        docker push $CI_REGISTRY_IMAGE/frontend:latest
      fi
  only:
    - main
    - develop

deploy:staging:
  stage: deploy
  image: alpine:latest
  environment:
    name: staging
    url: https://staging.bvmw-survey.example.com
  before_script:
    - apk add --no-cache ansible openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$STAGING_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 700 ~/.ssh
  script:
    - cd ansible
    - |
      ansible-playbook -i "$STAGING_HOST," site.yml \
        -u "$STAGING_USER" \
        --extra-vars "app_environment=staging \
                      app_db_host=$STAGING_DB_HOST \
                      app_db_port=$STAGING_DB_PORT \
                      app_db_name=$STAGING_DB_NAME \
                      app_db_user=$STAGING_DB_USER \
                      app_db_password=$STAGING_DB_PASSWORD \
                      docker_registry=$CI_REGISTRY_IMAGE \
                      docker_tag=$CI_COMMIT_SHA"
  only:
    - develop
  when: manual

deploy:production:
  stage: deploy
  image: alpine:latest
  environment:
    name: production
    url: https://bvmw-survey.example.com
  before_script:
    - apk add --no-cache ansible openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$PRODUCTION_SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$PRODUCTION_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 700 ~/.ssh
  script:
    - cd ansible
    - |
      ansible-playbook -i "$PRODUCTION_HOST," site.yml \
        -u "$PRODUCTION_USER" \
        --extra-vars "app_environment=production \
                      app_db_host=$PRODUCTION_DB_HOST \
                      app_db_port=$PRODUCTION_DB_PORT \
                      app_db_name=$PRODUCTION_DB_NAME \
                      app_db_user=$PRODUCTION_DB_USER \
                      app_db_password=$PRODUCTION_DB_PASSWORD \
                      docker_registry=$CI_REGISTRY_IMAGE \
                      docker_tag=$CI_COMMIT_SHA"
  only:
    - main
  when: manual
  allow_failure: false

rollback:production:
  stage: deploy
  image: alpine:latest
  environment:
    name: production
    url: https://bvmw-survey.example.com
  before_script:
    - apk add --no-cache ansible openssh-client
    - eval $(ssh-agent -s)
    - echo "$PRODUCTION_SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$PRODUCTION_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
  script:
    - cd ansible
    - |
      ansible-playbook -i "$PRODUCTION_HOST," rollback.yml \
        -u "$PRODUCTION_USER" \
        --extra-vars "rollback_version=$ROLLBACK_VERSION"
  only:
    - main
  when: manual
  allow_failure: false