---
- name: Deploy Survey Platform - Staging Environment
  hosts: staging
  become: yes
  serial: 2  # Rolling deployment
  max_fail_percentage: 50
  
  pre_tasks:
    - name: Load staging variables
      include_vars: group_vars/staging.yml
    
    - name: Check if deployment is allowed
      fail:
        msg: "Deployment blocked by maintenance window"
      when: maintenance_mode | default(false)
    
    - name: Create deployment backup
      shell: |
        timestamp=$(date +%Y%m%d_%H%M%S)
        docker-compose -f {{ project_path }}/docker-compose.yml exec -T db \
          pg_dump -U {{ db_user }} {{ db_name }} | gzip > /tmp/staging_backup_${timestamp}.sql.gz
      delegate_to: "{{ groups['staging'][0] }}"
      run_once: true
      when: backup_before_deploy | default(true)
  
  roles:
    - role: common
      tags: ['common']
    - role: docker
      tags: ['docker']
    - role: application
      tags: ['app']
    - role: nginx
      tags: ['nginx']
      when: setup_nginx
    - role: monitoring
      tags: ['monitoring']
      when: setup_monitoring
  
  tasks:
    - name: Pull latest Docker images
      docker_image:
        name: "{{ docker_registry }}/survey:{{ docker_image_tag }}"
        source: pull
        force_source: yes
      when: docker_registry != ""
    
    - name: Deploy application with blue-green strategy
      block:
        - name: Start new containers (green)
          docker_container:
            name: "survey-backend-green"
            image: "{{ docker_registry }}/survey:{{ docker_image_tag }}"
            state: started
            ports:
              - "8001:8000"
            env_file: "{{ project_path }}/.env"
            networks:
              - name: "{{ docker_network_name }}"
        
        - name: Health check new containers
          uri:
            url: "http://localhost:8001/health"
            status_code: 200
          retries: 10
          delay: 5
        
        - name: Switch traffic to new containers
          lineinfile:
            path: /etc/nginx/sites-available/survey
            regexp: 'proxy_pass http://localhost:800[01];'
            line: '        proxy_pass http://localhost:8001;'
          notify: reload nginx
        
        - name: Stop old containers (blue)
          docker_container:
            name: "survey-backend-blue"
            state: stopped
          ignore_errors: yes
        
        - name: Rename containers
          shell: |
            docker rename survey-backend-blue survey-backend-old || true
            docker rename survey-backend-green survey-backend-blue
            docker rm survey-backend-old || true
      when: blue_green_deployment | default(true)
    
    - name: Standard deployment (if not blue-green)
      docker_compose:
        project_src: "{{ project_path }}"
        pull: yes
        recreate: smart
        restarted: yes
      when: not (blue_green_deployment | default(true))
    
    - name: Run database migrations
      docker_container:
        name: migration-runner
        image: "{{ docker_registry }}/survey:{{ docker_image_tag }}"
        command: "poetry run alembic upgrade head"
        env_file: "{{ project_path }}/.env"
        networks:
          - name: "{{ docker_network_name }}"
        cleanup: yes
        detach: no
      run_once: true
    
    - name: Clear application cache
      shell: |
        docker exec survey-backend redis-cli FLUSHDB
      when: cache_enabled and clear_cache_on_deploy | default(true)
      ignore_errors: yes
    
    - name: Run smoke tests
      uri:
        url: "{{ item }}"
        status_code: 200
      loop:
        - "https://{{ nginx_server_name }}/health"
        - "https://{{ nginx_server_name }}/api/v1/health"
        - "https://{{ nginx_server_name }}/docs"
      when: run_smoke_tests | default(true)
    
    - name: Run integration tests
      shell: |
        cd {{ project_path }}
        docker-compose run --rm backend poetry run pytest tests/integration/
      when: run_integration_tests | default(false)
    
    - name: Send deployment notification
      uri:
        url: "{{ slack_webhook_url }}"
        method: POST
        body_format: json
        body:
          text: "✅ Staging deployment completed successfully for version {{ docker_image_tag }}"
      when: slack_webhook_url is defined and slack_webhook_url != ""
      ignore_errors: yes
  
  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded
    
    - name: restart docker
      systemd:
        name: docker
        state: restarted
  
  post_tasks:
    - name: Verify deployment
      uri:
        url: "https://{{ nginx_server_name }}/api/v1/version"
      register: version_check
    
    - name: Display deployment summary
      debug:
        msg:
          - "===================== Staging Deployment Complete ====================="
          - "Environment: {{ environment_name }}"
          - "URL: https://{{ nginx_server_name }}"
          - "Version: {{ version_check.json.version | default('unknown') }}"
          - "Servers deployed: {{ ansible_play_hosts | length }}"
          - "======================================================================"