[local]
localhost ansible_connection=local

[development]
dev-server ansible_host=10.0.1.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[staging]
staging-server ansible_host=staging.bvmw-survey.com ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[production]
prod-server-1 ansible_host=prod1.bvmw-survey.com ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
prod-server-2 ansible_host=prod2.bvmw-survey.com ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[webservers:children]
development
staging
production

[databases]
db-primary ansible_host=db1.bvmw-survey.com ansible_user=postgres
db-replica ansible_host=db2.bvmw-survey.com ansible_user=postgres

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
gather_facts=yes