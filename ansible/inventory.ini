## Survey Platform - Ansible Inventory

# Local Development Environment
[local]
localhost ansible_connection=local

# Development Environment
[development]
dev-server-1 ansible_host=10.0.1.10 ansible_user=ubuntu
dev-server-2 ansible_host=10.0.1.11 ansible_user=ubuntu

# Staging Environment
[staging]
staging-web-1 ansible_host=staging1.survey-platform.com ansible_user=ubuntu
staging-web-2 ansible_host=staging2.survey-platform.com ansible_user=ubuntu
staging-worker ansible_host=staging-worker.survey-platform.com ansible_user=ubuntu

# Production Environment
[production]
umfrage.koeln-bvmw.de ansible_host=91.98.38.163 ansible_user=root
prod-web-1 ansible_host=prod1.survey-platform.com ansible_user=ubuntu
prod-web-2 ansible_host=prod2.survey-platform.com ansible_user=ubuntu
prod-web-3 ansible_host=prod3.survey-platform.com ansible_user=ubuntu
prod-worker-1 ansible_host=prod-worker1.survey-platform.com ansible_user=ubuntu
prod-worker-2 ansible_host=prod-worker2.survey-platform.com ansible_user=ubuntu

# Database Servers
[databases]
db-primary ansible_host=db1.survey-platform.internal ansible_user=postgres
db-replica-1 ansible_host=db2.survey-platform.internal ansible_user=postgres
db-replica-2 ansible_host=db3.survey-platform.internal ansible_user=postgres

[databases:children]
databases_primary
databases_replica

[databases_primary]
db-primary

[databases_replica]
db-replica-1
db-replica-2

# Redis Servers
[redis]
redis-primary ansible_host=redis1.survey-platform.internal ansible_user=ubuntu
redis-replica ansible_host=redis2.survey-platform.internal ansible_user=ubuntu

# Load Balancers
[loadbalancers]
lb-1 ansible_host=lb1.survey-platform.com ansible_user=ubuntu
lb-2 ansible_host=lb2.survey-platform.com ansible_user=ubuntu

# Monitoring Servers
[monitoring]
monitoring-1 ansible_host=monitoring.survey-platform.com ansible_user=ubuntu

# Backup Servers
[backup]
backup-1 ansible_host=backup.survey-platform.com ansible_user=ubuntu

# Groups by Role
[webservers:children]
development
staging
production

[workers:children]
staging
production

[infrastructure:children]
databases
redis
loadbalancers
monitoring
backup

# Environment Groups
[staging_all:children]
staging
databases
redis

[production_all:children]
production
databases
redis
loadbalancers
monitoring
backup

# SSH Configuration
[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_ssh_pipelining=true

# Default SSH Keys by Environment
[local:vars]
ansible_ssh_private_key_file=~/.ssh/id_rsa

[development:vars]
ansible_ssh_private_key_file=~/.ssh/survey_dev_key

[staging:vars]
ansible_ssh_private_key_file=~/.ssh/survey_staging_key

[production:vars]
ansible_ssh_private_key_file=~/.ssh/id_rsa

[infrastructure:vars]
ansible_ssh_private_key_file=~/.ssh/survey_infra_key