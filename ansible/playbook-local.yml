---
- name: Setup Survey Platform - Local Development
  hosts: local
  connection: local
  become: no
  vars:
    project_path: "{{ playbook_dir }}/.."
    
  tasks:
    - name: Check Python version
      command: python3 --version
      register: python_version
      changed_when: false
    
    - name: Display Python version
      debug:
        msg: "Python version: {{ python_version.stdout }}"
    
    - name: Install Poetry (if not installed)
      shell: |
        if ! command -v poetry &> /dev/null; then
          curl -sSL https://install.python-poetry.org | python3 -
        fi
      args:
        executable: /bin/bash
    
    - name: Install Python dependencies
      shell: |
        cd {{ project_path }}
        poetry install --no-root
      args:
        executable: /bin/bash
    
    - name: Create .env file from example if not exists
      copy:
        src: "{{ project_path }}/.env.example"
        dest: "{{ project_path }}/.env"
        force: no
    
    - name: Check Docker installation
      command: docker --version
      register: docker_check
      ignore_errors: yes
      changed_when: false
    
    - name: Check Docker Compose installation
      command: docker-compose --version
      register: docker_compose_check
      ignore_errors: yes
      changed_when: false
    
    - name: Display Docker status
      debug:
        msg:
          - "Docker: {{ docker_check.stdout | default('Not installed') }}"
          - "Docker Compose: {{ docker_compose_check.stdout | default('Not installed') }}"
    
    - name: Create local directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ project_path }}/logs"
        - "{{ project_path }}/data"
        - "{{ project_path }}/media"
        - "{{ project_path }}/static"
    
    - name: Start Docker services
      shell: |
        cd {{ project_path }}
        docker-compose up -d
      when: docker_check.rc == 0 and docker_compose_check.rc == 0
    
    - name: Wait for database to be ready
      wait_for:
        port: 5432
        host: localhost
        delay: 5
        timeout: 30
      when: docker_check.rc == 0
    
    - name: Run database migrations
      shell: |
        cd {{ project_path }}
        poetry run alembic upgrade head
      ignore_errors: yes
    
    - name: Create test admin user
      shell: |
        cd {{ project_path }}
        poetry run python -c "
        from app.database import SessionLocal
        from app.models import Member
        from app.security import get_password_hash
        try:
            db = SessionLocal()
            admin = db.query(Member).filter_by(email='admin@localhost').first()
            if not admin:
                admin = Member(
                    email='admin@localhost',
                    hashed_password=get_password_hash('admin123'),
                    name='Local Admin',
                    role='admin'
                )
                db.add(admin)
                db.commit()
                print('Admin user created: admin@localhost / admin123')
            else:
                print('Admin user already exists')
            db.close()
        except Exception as e:
            print(f'Error: {e}')
        "
      when: create_admin_user | default(true)
    
    - name: Install development tools
      pip:
        name:
          - ipython
          - ipdb
          - pytest-watch
          - black
          - isort
          - flake8
          - mypy
        extra_args: --user
      when: install_dev_tools | default(true)
    
    - name: Setup Git hooks
      shell: |
        cd {{ project_path }}
        cat > .git/hooks/pre-commit << 'EOF'
        #!/bin/bash
        poetry run black --check app tests
        poetry run isort --check-only app tests
        poetry run flake8 app tests
        EOF
        chmod +x .git/hooks/pre-commit
      when: setup_git_hooks | default(false)
    
    - name: Display local development information
      debug:
        msg:
          - "===================== Survey Platform - Local Setup Complete ====================="
          - "Project Path: {{ project_path }}"
          - "API URL: http://localhost:8000"
          - "API Docs: http://localhost:8000/docs"
          - "Database: PostgreSQL on localhost:5432"
          - "Admin Login: admin@localhost / admin123"
          - ""
          - "Useful Commands:"
          - "  Start services: docker-compose up -d"
          - "  View logs: docker-compose logs -f"
          - "  Run tests: poetry run pytest"
          - "  Run dev server: poetry run uvicorn app.main:app --reload"
          - "  Format code: poetry run black . && poetry run isort ."
          - "======================================================================================"