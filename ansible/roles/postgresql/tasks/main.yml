---
- name: install_packages
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present

- name: start_service
  systemd:
    name: postgresql
    state: started
    enabled: yes

- name: create_user
  become_user: postgres
  postgresql_user:
    name: "{{ postgresql_db_owner }}"
    password: "{{ postgresql_db_password }}"
    role_attr_flags: CREATEDB,NOSUPERUSER

- name: create_database
  become_user: postgres
  postgresql_db:
    name: "{{ postgresql_db_name }}"
    owner: "{{ postgresql_db_owner }}"
    encoding: UTF-8

- name: configure_listen
  lineinfile:
    path: "{{ postgresql_conf_path }}"
    regexp: '^#?listen_addresses'
    line: "listen_addresses = '*'"
  notify: restart_postgresql

- name: configure_auth
  lineinfile:
    path: "{{ postgresql_hba_path }}"
    line: "host    all             all             172.0.0.0/8             md5"
    insertafter: "^host.*all.*all.*127"
  notify: restart_postgresql

- name: restart_if_needed
  meta: flush_handlers

- name: copy_init_sql
  copy:
    src: "{{ playbook_dir }}/../init.sql"
    dest: /tmp/init.sql

- name: init_schema
  become_user: postgres
  shell: |
    set -euo pipefail
    psql -d "{{ postgresql_db_name }}" -f /tmp/init.sql
    touch "{{ postgresql_schema_marker_path }}"
  args:
    creates: "{{ postgresql_schema_marker_path }}"

- name: grant_permissions
  become_user: postgres
  postgresql_query:
    db: "{{ postgresql_db_name }}"
    query: |
      GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO "{{ postgresql_db_owner }}";
      GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO "{{ postgresql_db_owner }}";
      GRANT ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA public TO "{{ postgresql_db_owner }}";
      GRANT CREATE ON SCHEMA public TO "{{ postgresql_db_owner }}";
