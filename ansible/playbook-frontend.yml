---
- name: Deploy Frontend Application
  hosts: web_servers
  become: yes
  vars:
    node_version: "{{ frontend_node_version | default('20') }}"
    npm_version: "{{ frontend_npm_version | default('10') }}"
    frontend_user: "{{ app_user | default('survey') }}"
    frontend_group: "{{ app_group | default('survey') }}"
    nginx_sites_available: /etc/nginx/sites-available
    nginx_sites_enabled: /etc/nginx/sites-enabled
  
  pre_tasks:
    - name: Validate frontend configuration
      assert:
        that:
          - frontend_path is defined
          - frontend_api_url is defined
        fail_msg: "Required frontend variables are not defined"
    
    - name: Display deployment information
      debug:
        msg:
          - "Environment: {{ environment }}"
          - "Frontend Path: {{ frontend_path }}"
          - "API URL: {{ frontend_api_url }}"
          - "Node Version: {{ node_version }}"
  
  tasks:
    - name: Install Node.js and npm
      tags: [setup, nodejs]
      block:
        - name: Add NodeSource repository key
          apt_key:
            url: https://deb.nodesource.com/gpgkey/nodesource.gpg.key
            state: present
        
        - name: Add NodeSource repository
          apt_repository:
            repo: "deb https://deb.nodesource.com/node_{{ node_version }}.x {{ ansible_distribution_release }} main"
            state: present
            update_cache: yes
        
        - name: Install Node.js
          apt:
            name: nodejs
            state: present
        
        - name: Update npm to specific version
          npm:
            name: npm
            version: "{{ npm_version }}"
            global: yes
    
    - name: Create frontend directory structure
      tags: [setup, directories]
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ frontend_user }}"
        group: "{{ frontend_group }}"
        mode: '0755'
      loop:
        - "{{ frontend_path }}"
        - "{{ frontend_path }}/releases"
        - "{{ frontend_path }}/shared"
        - /var/log/nginx
    
    - name: Clone or update frontend repository
      tags: [deploy, code]
      git:
        repo: "{{ git_repo_url }}"
        dest: "{{ frontend_path }}/releases/{{ ansible_date_time.epoch }}"
        version: "{{ git_branch | default('main') }}"
        force: yes
      become_user: "{{ frontend_user }}"
      register: git_result
    
    - name: Install frontend dependencies
      tags: [deploy, dependencies]
      npm:
        path: "{{ frontend_path }}/releases/{{ ansible_date_time.epoch }}/frontend"
        state: present
        production: "{{ 'true' if environment != 'local' else 'false' }}"
      become_user: "{{ frontend_user }}"
    
    - name: Create frontend environment file
      tags: [deploy, config]
      template:
        src: frontend.env.j2
        dest: "{{ frontend_path }}/releases/{{ ansible_date_time.epoch }}/frontend/.env.{{ environment }}"
        owner: "{{ frontend_user }}"
        group: "{{ frontend_group }}"
        mode: '0640'
    
    - name: Build frontend for production
      tags: [deploy, build]
      command: npm run build
      args:
        chdir: "{{ frontend_path }}/releases/{{ ansible_date_time.epoch }}/frontend"
      environment:
        NODE_ENV: production
        VITE_API_URL: "{{ frontend_api_url }}"
        VITE_APP_ENV: "{{ environment }}"
      become_user: "{{ frontend_user }}"
      when: environment != 'local'
    
    - name: Create symlink to current release
      tags: [deploy, symlink]
      file:
        src: "{{ frontend_path }}/releases/{{ ansible_date_time.epoch }}/frontend/dist"
        dest: "{{ frontend_path }}/current"
        state: link
        force: yes
        owner: "{{ frontend_user }}"
        group: "{{ frontend_group }}"
      when: environment != 'local'
    
    - name: Install and configure nginx
      tags: [setup, nginx]
      when: setup_nginx | default(false)
      block:
        - name: Install nginx
          apt:
            name: nginx
            state: present
        
        - name: Create nginx configuration
          template:
            src: nginx-frontend.conf.j2
            dest: "{{ nginx_sites_available }}/{{ project_name }}-frontend"
            owner: root
            group: root
            mode: '0644'
        
        - name: Enable nginx site
          file:
            src: "{{ nginx_sites_available }}/{{ project_name }}-frontend"
            dest: "{{ nginx_sites_enabled }}/{{ project_name }}-frontend"
            state: link
        
        - name: Remove default nginx site
          file:
            path: "{{ nginx_sites_enabled }}/default"
            state: absent
        
        - name: Test nginx configuration
          command: nginx -t
          changed_when: false
        
        - name: Reload nginx
          systemd:
            name: nginx
            state: reloaded
            enabled: yes
    
    - name: Setup SSL certificate
      tags: [setup, ssl]
      when: setup_ssl | default(false)
      block:
        - name: Install Certbot
          apt:
            name:
              - certbot
              - python3-certbot-nginx
            state: present
        
        - name: Generate SSL certificate
          command: >
            certbot certonly --nginx
            --non-interactive
            --agree-tos
            --email {{ letsencrypt_email }}
            --domains {{ nginx_server_name }}
            {% if letsencrypt_staging | default(false) %}--staging{% endif %}
          args:
            creates: "/etc/letsencrypt/live/{{ nginx_server_name }}/fullchain.pem"
        
        - name: Setup auto-renewal
          cron:
            name: "Renew SSL certificates"
            job: "certbot renew --quiet --no-self-upgrade"
            hour: "2"
            minute: "30"
            state: present
    
    - name: Clean up old releases
      tags: [deploy, cleanup]
      shell: |
        cd {{ frontend_path }}/releases && \
        ls -t | tail -n +6 | xargs -r rm -rf
      args:
        warn: false
      when: cleanup_old_releases | default(true)
    
    - name: Run frontend health check
      tags: [deploy, healthcheck]
      uri:
        url: "http://localhost{% if frontend_dev_server_port is defined %}:{{ frontend_dev_server_port }}{% endif %}/health"
        method: GET
        status_code: [200, 404]
      register: health_check
      ignore_errors: yes
    
    - name: Setup monitoring
      tags: [setup, monitoring]
      when: setup_monitoring | default(false)
      block:
        - name: Copy monitoring scripts
          copy:
            src: "scripts/{{ item }}"
            dest: "/usr/local/bin/{{ item }}"
            owner: root
            group: root
            mode: '0755'
          loop:
            - health_check.sh
            - monitor.py
        
        - name: Setup monitoring cron job
          cron:
            name: "Frontend health monitoring"
            job: "/usr/local/bin/health_check.sh --frontend --json >> /var/log/survey-platform/health.log 2>&1"
            minute: "*/5"
            state: present
  
  post_tasks:
    - name: Display deployment summary
      debug:
        msg:
          - "Frontend deployment completed successfully!"
          - "Environment: {{ environment }}"
          - "Version: {{ git_result.after | default('unknown') }}"
          - "Frontend URL: {{ 'https' if setup_ssl else 'http' }}://{{ nginx_server_name | default('localhost') }}"
          - "API URL: {{ frontend_api_url }}"
    
    - name: Send deployment notification
      uri:
        url: "{{ slack_webhook_url }}"
        method: POST
        body_format: json
        body:
          text: "Frontend deployed to {{ environment }}"
          blocks:
            - type: section
              text:
                type: mrkdwn
                text: |
                  *Frontend Deployment Successful* ✅
                  • Environment: `{{ environment }}`
                  • Version: `{{ git_result.after | default('unknown') | truncate(8, True, '') }}`
                  • URL: {{ 'https' if setup_ssl else 'http' }}://{{ nginx_server_name | default('localhost') }}
      when: slack_webhook_url is defined and slack_webhook_url != ''
      ignore_errors: yes
  
  handlers:
    - name: restart nginx
      systemd:
        name: nginx
        state: restarted
        daemon_reload: yes