---
- name: Deploy Survey Platform
  hosts: "{{ target | default('all') }}"
  become: yes
  vars:
    project_path: /opt/survey-platform
    backup_path: /opt/backups
    docker_compose_file: docker-compose.prod.yml

  tasks:
    - name: Include environment variables
      include_vars: "group_vars/{{ env | default('production') }}.yml"

    - name: Run Docker role
      include_role:
        name: docker
      tags: docker

    - name: Run Application deployment
      include_role:
        name: app
      tags: app

    - name: Run Backup setup
      include_role:
        name: backup
      tags: backup

    - name: Health check
      uri:
        url: "http://localhost:8000/health"
        status_code: 200
      retries: 5
      delay: 10
      tags: health

    - name: Display deployment status
      debug:
        msg: "Deployment completed successfully for {{ inventory_hostname }}"