---
- hosts: all
  become: yes
  vars:
    app_dir: /opt/bvmw-survey
    rollback_version: "{{ rollback_version | default('latest') }}"
  tasks:
    - name: stop_current_containers
      command: docker-compose down
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: yes

    - name: pull_rollback_images
      docker_image:
        name: "{{ docker_registry }}/{{ item }}:{{ rollback_version }}"
        source: pull
      loop:
        - backend
        - frontend

    - name: tag_rollback_as_current
      command: |
        docker tag {{ docker_registry }}/{{ item }}:{{ rollback_version }} {{ docker_registry }}/{{ item }}:current
      loop:
        - backend
        - frontend

    - name: update_docker_compose_with_rollback_version
      replace:
        path: "{{ app_dir }}/docker-compose.yml"
        regexp: ':latest'
        replace: ':{{ rollback_version }}'

    - name: start_rollback_containers
      command: docker-compose up -d
      args:
        chdir: "{{ app_dir }}"

    - name: verify_rollback
      uri:
        url: "http://localhost:8000/health"
        status_code: 200
      retries: 10
      delay: 5