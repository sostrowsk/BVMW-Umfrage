---
# Project Configuration
project_name: bvmw-survey-platform
project_path: /opt/bvmw-survey
project_user: bvmw
project_group: bvmw

# Git Repository (uncomment and set for remote deployment)
# git_repository_url: https://github.com/yourusername/bvmw-survey.git
# git_branch: main

# Database Configuration
db_host: localhost
db_port: 5432
db_name: bvmw_survey
db_user: user
db_password: "{{ vault_db_password | default('password') }}"
db_backup_path: /var/backups/postgresql

# Application Configuration
app_host: 0.0.0.0
app_port: 8000
app_workers: 4
app_reload: false
app_log_level: info

# JWT Configuration
secret_key: "{{ vault_secret_key | default('your-secret-key-here-change-in-production') }}"
algorithm: HS256
access_token_expire_minutes: 30
refresh_token_expire_days: 7

# Email Configuration
smtp_host: smtp.gmail.com
smtp_port: 587
smtp_user: "{{ vault_smtp_user | default('your-email@gmail.com') }}"
smtp_password: "{{ vault_smtp_password | default('your-app-password') }}"
smtp_from_email: noreply@bvmw-survey.com
smtp_from_name: BVMW Survey Platform

# Admin User Configuration
create_admin_user: true
admin_email: admin@bvmw-survey.com
admin_password: "{{ vault_admin_password | default('changeme123') }}"
admin_name: System Administrator

# Docker Configuration
docker_network_name: bvmw_network
docker_compose_version: 2.23.3
docker_registry: ""
docker_image_tag: latest

# Python Configuration
python_version: "3.11"
poetry_version: 1.7.1
virtualenv_path: "{{ project_path }}/venv"

# PostgreSQL Configuration
postgres_version: "15"
postgres_max_connections: 100
postgres_shared_buffers: 256MB
postgres_effective_cache_size: 1GB

# Nginx Configuration (optional)
setup_nginx: false
nginx_server_name: bvmw-survey.com
nginx_ssl_cert_path: /etc/ssl/certs/bvmw-survey.crt
nginx_ssl_key_path: /etc/ssl/private/bvmw-survey.key
nginx_client_max_body_size: 10M

# Redis Configuration (optional, for future caching)
setup_redis: false
redis_host: localhost
redis_port: 6379
redis_password: ""
redis_db: 0

# Monitoring Configuration
setup_monitoring: false
prometheus_port: 9090
grafana_port: 3000
grafana_admin_user: admin
grafana_admin_password: "{{ vault_grafana_password | default('admin') }}"

# Backup Configuration
setup_backup: true
backup_retention_days: 30
backup_s3_bucket: ""
backup_s3_region: eu-central-1
backup_s3_access_key: "{{ vault_s3_access_key | default('') }}"
backup_s3_secret_key: "{{ vault_s3_secret_key | default('') }}"

# Security Configuration
setup_firewall: true
allowed_ssh_ips:
  - 0.0.0.0/0
allowed_http_ips:
  - 0.0.0.0/0
fail2ban_enabled: true
fail2ban_maxretry: 5
fail2ban_bantime: 3600

# SSL/TLS Configuration
setup_ssl: false
ssl_provider: letsencrypt
letsencrypt_email: admin@bvmw-survey.com
letsencrypt_staging: false

# Logging Configuration
log_path: /var/log/bvmw-survey
log_retention_days: 90
log_max_size: 100M
sentry_dsn: "{{ vault_sentry_dsn | default('') }}"

# Feature Flags
use_alembic: false
enable_api_docs: true
enable_cors: true
cors_origins:
  - http://localhost:3000
  - http://localhost:8080
  - https://app.bvmw-survey.com

# Performance Tuning
max_request_size: 10485760  # 10MB
request_timeout: 30
keepalive_timeout: 65
worker_connections: 1000

# Development Settings (override in group_vars/development.yml)
debug_mode: false
hot_reload: false
mock_external_services: false

# Environment-specific settings
environment: production