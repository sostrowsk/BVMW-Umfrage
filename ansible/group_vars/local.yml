---
# Local Development Environment Configuration
environment: local
environment_name: "Local Development"

# Application Settings
app_workers: 1
app_reload: true
app_log_level: debug
debug_mode: true
hot_reload: true

# Database Configuration
db_host: localhost
db_port: 5432
db_name: survey_platform_local
db_user: user
db_password: password

# No SSL for local development
setup_ssl: false
setup_nginx: false
setup_firewall: false
setup_monitoring: false
setup_backup: false

# Docker Configuration
docker_network_name: survey_local_network
docker_compose_env: development

# API Configuration
enable_api_docs: true
enable_cors: true
cors_origins:
  - http://localhost:3000
  - http://localhost:5173
  - http://localhost:8080
  - http://127.0.0.1:3000
  - http://127.0.0.1:5173
  - http://127.0.0.1:8080

# Email Configuration (use local mail catcher)
smtp_host: localhost
smtp_port: 1025
smtp_user: ""
smtp_password: ""
smtp_from_email: noreply@localhost
emails_enabled: false

# Feature Flags for Development
enable_user_registration: true
enable_password_recovery: true
enable_email_verification: false
enable_anonymous_responses: true
mock_external_services: true

# Performance Settings (optimized for development)
max_request_size: 10485760
request_timeout: 60
worker_connections: 100

# Logging
log_path: /var/log/survey-platform-local
log_retention_days: 7
log_level: debug

# Cache disabled for development
cache_enabled: false

# Development Tools
install_dev_tools: true
setup_debugger: true
enable_profiling: true

# Frontend Configuration
frontend_path: /opt/survey-platform/frontend
frontend_build_command: npm run dev
frontend_node_version: '20'
frontend_npm_version: '10'
frontend_api_url: http://localhost:8000
frontend_api_timeout: 60000  # Longer timeout for debugging
frontend_enable_analytics: false
frontend_enable_debug: true
frontend_enable_mock_data: true
frontend_default_locale: de
frontend_supported_locales: de,en

# Frontend Development
frontend_dev_server_port: 5173
frontend_dev_server_host: localhost
frontend_dev_server_https: false
frontend_dev_server_open: true
frontend_dev_server_hmr: true

# Frontend Performance (development)
frontend_enable_compression: false
frontend_enable_caching: false
frontend_cache_max_age: 0
frontend_cache_html_max_age: 0

# Frontend Security (relaxed for development)
frontend_csp_enabled: false
frontend_frame_options: SAMEORIGIN
frontend_content_type_options: nosniff
frontend_xss_protection: '1; mode=block'

# Frontend Build Optimization (development)
frontend_build_source_maps: true
frontend_build_minify: false
frontend_build_tree_shake: false
frontend_build_chunk_size_limit: 10000  # Higher limit for dev

# Frontend External Services
frontend_sentry_dsn: ""
frontend_google_analytics_id: ""

# Frontend Deployment
frontend_deployment_strategy: direct
frontend_health_check_path: /health
frontend_readiness_check_path: /ready
frontend_warm_up_requests: 0